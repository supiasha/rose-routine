<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>viewport check (temporary)</title>
<style>html,body{margin:0;background:#e9e4dc}iframe{border:0;display:block;margin:0 auto;background:#fff}</style></head>
<body>
<script>
var q = new URLSearchParams(location.search);
var w = parseInt(q.get('w') || '1024', 10);
var h = parseInt(q.get('h') || '1000', 10);
var f = document.createElement('iframe');
f.width = w; f.height = h; f.src = './index.html';
document.body.appendChild(f);
</script>
</body></html>
