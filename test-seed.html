<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>임시 점검 · 저장 상태 이전 테스트</title>
<style>body{font-family:system-ui,sans-serif;padding:24px;line-height:1.7;max-width:720px}</style>
</head><body>
<h1>임시 점검 페이지</h1>
<p>11-23 저장 상태(루틴 8개, 약먹기 미션 포함)를 넣고 앱을 엽니다. 확인 후 이 페이지는 삭제됩니다.</p>
<pre id="log">-</pre>
<p><a id="go" href="index.html">앱으로 이동</a></p>
<script>
(function(){
  var today = new Date();
  function pad(n){ return (n<10?'0':'')+n; }
  var todayKey = today.getFullYear()+'-'+pad(today.getMonth()+1)+'-'+pad(today.getDate());
  var state = {
    settings: {
      child: "로제", title: "로제의 하루 일과",
      startTime: "08:30", startText: "아침 시작", endTime: "21:00", endText: "잠자리",
      neighborhood: "서울",
      routines: [
        { emoji: "🎒", name: "등원 준비", start: "08:30", end: "08:50", period: "morning", enabled: true },
        { emoji: "🍚", name: "저녁먹기", start: "18:30", end: "19:10", period: "evening", enabled: true },
        { emoji: "🌈", name: "레인보우브릿지", start: "19:10", end: "19:30", period: "evening", enabled: true },
        { emoji: "📚", name: "도서관책읽기", start: "19:30", end: "20:00", period: "evening", enabled: true },
        { emoji: "✏️", name: "리터러시", start: "20:00", end: "20:30", period: "literacy", enabled: true },
        { emoji: "🪥", name: "씻기·양치하기", start: "20:30", end: "20:50", period: "evening", enabled: true },
        { emoji: "🌙", name: "잠옷입기·잠자리 준비", start: "20:50", end: "21:00", period: "evening", enabled: true },
        { emoji: "💊", name: "약먹기", start: "", end: "", period: "mission", enabled: true }
      ],
      literacyMigrated: true, missionMigrated: true, missionSeeded: true,
      schedTitle: "🌙 오늘도 수고했어!", schedNote: "이따 푹 자고 내일 또 만나요 💛",
      notes: ["🍚 저녁 맛있게 먹고 숙제 끝내기"], supplies: "설정(⚙️)에서 내일 준비물을 적어 둘 수 있어요", wear: ""
    },
    sound: true,
    doneDate: todayKey,
    done: [true, false, true, false, false, false, true, true],
    fail: [false, false, false, false, false, false, false, false],
    alarmLog: {}
  };
  var stamps = {};
  ["2026-11-20","2026-11-21","2026-11-22","2026-11-23","2026-11-24","2026-11-26"].forEach(function(k){ stamps[k] = true; });
  if (location.search.indexOf("clear") >= 0) {
    ["rose-evening-routine.v2","rose-evening-routine.coins.v1","rose-evening-routine.coins.date.v1",
     "rose-evening-routine.stamps.v1","rose-evening-routine.stamps.seeded.v1","rose-evening-routine.stickers.v1"].forEach(function(k){
      try { localStorage.removeItem(k); } catch (e) {}
    });
    document.getElementById("log").textContent = "테스트 저장값을 지웠어요. 앱을 열면 기본 상태로 시작합니다.";
    return;
  }
  try {
    localStorage.setItem("rose-evening-routine.v2", JSON.stringify(state));
    localStorage.setItem("rose-evening-routine.coins.v1", "4");
    localStorage.setItem("rose-evening-routine.coins.date.v1", todayKey);
    localStorage.setItem("rose-evening-routine.stamps.v1", JSON.stringify(stamps));
    localStorage.setItem("rose-evening-routine.stickers.v1", JSON.stringify([0,1,2]));
    document.getElementById("log").textContent = "넣었어요: 루틴 8개 · 완료 4개(약먹기 포함) · 당근 4 · 도장 " + Object.keys(stamps).length + "개";
  } catch (e) {
    document.getElementById("log").textContent = "실패: " + e;
  }
})();
</script>
</body></html>
