<!doctype html>
<html><head><meta charset="utf-8"><title>diag</title></head>
<body><pre id="out">loading…</pre>
<script>
var K = ["rose-evening-routine.stamps.v1","rose-evening-routine.stamps.at.v1","rose-evening-routine.stamps.seeded.v1","rose-evening-routine.stickers.v1"];
function dump(){
  var o = { url: location.href, ls: {}, cookie: document.cookie, wname: window.name };
  K.forEach(function(k){ try { o.ls[k] = localStorage.getItem(k); } catch(e){ o.ls[k] = "ERR:" + e.name; } });
  var req = indexedDB.open("rose-evening-routine", 1);
  req.onupgradeneeded = function(){ try { req.result.createObjectStore("kv"); } catch(e){} };
  req.onsuccess = function(){
    var db = req.result;
    try {
      var tx = db.transaction("kv","readonly");
      var rq = tx.objectStore("kv").get("stamps.v1");
      rq.onsuccess = function(){ o.idb = rq.result; document.getElementById("out").textContent = JSON.stringify(o, null, 1); };
      rq.onerror = function(){ o.idb = "ERR"; document.getElementById("out").textContent = JSON.stringify(o, null, 1); };
    } catch(e) { o.idb = "ERR:" + e.name; document.getElementById("out").textContent = JSON.stringify(o, null, 1); }
  };
  req.onerror = function(){ o.idb = "OPEN_ERR"; document.getElementById("out").textContent = JSON.stringify(o, null, 1); };
}
dump();
</script>
</body></html>
